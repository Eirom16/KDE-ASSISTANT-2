# Offline TTS sink. No hardware modules, session manager, microphone or audible output.
context.properties = { core.daemon = true core.name = f4-unreachable-audio default.clock.rate = 22050 }
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access }
]
context.objects = [
    { factory = spa-node-factory args = { factory.name = support.node.driver node.name = F4-TTS-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = f4-tts-sink
        media.class = Audio/Sink
        audio.position = [ MONO ]
        node.param.PortConfig = { direction = Input mode = dsp format = { mediaType = audio mediaSubtype = raw format = F32P rate = 22050 channels = 1 position = [ MONO ] } }
    } }
]

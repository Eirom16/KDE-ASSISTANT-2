# Isolated synthetic daemon. No ALSA, Pulse, portal, udev, Bluetooth or session manager.
context.properties = { core.daemon = true core.name = f4-synthetic default.clock.rate = 48000 }
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    audiotestsrc = audiotestsrc/libspa-audiotestsrc
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access }
]
stream.properties = { adapter.auto-port-config = { mode = dsp } }
context.objects = [
    { factory = spa-node-factory args = { factory.name = support.node.driver node.name = F4-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter args = {
        factory.name = audiotestsrc
        node.name = f4-synthetic-source
        media.class = Audio/Source
        audio.position = [ MONO ]
        node.always-process = true
        node.param.PortConfig = { direction = Output mode = dsp format = { mediaType = audio mediaSubtype = raw format = F32P rate = 48000 channels = 1 position = [ MONO ] } }
    } }
]

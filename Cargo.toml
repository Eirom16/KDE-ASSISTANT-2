[package]
name = "kde-assistant"
version = "0.1.0"
edition = "2021"
description = "Asistente de escritorio para KDE Plasma con estetica Apple, tool calling, voz estilo Siri y tray multifuncion"
authors = ["KDE Assistant Dev"]
license = "MIT"

default-run = "kde-assistant"

[[bin]]
name = "kde-assistant"
path = "src/main.rs"

[lib]
name = "kde_assistant_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP client (OpenRouter API)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Audio capture (cpal)
cpal = "0.15"

# Chimes + TTS playback (rodio)
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }
hound = "3.5"   # WAV writer para chimes sinteticos

# TTS (espeak-ng FFI)
espeak-ng = "0.2"

# Wake Word (ONNX runtime via ort, descarga binarios automatico)
# Deshabilitado por ahora: problemas con ureq-tls en version actual
# ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries"] }
ndarray = "0.16"

# Numerics for VAD/RMS
# (incluido en std, no necesario)

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
once_cell = "1"
hex = "0.4"

# Speech - whisper-rs (comentada: requiere build pesado con cmake/clang)
# Se puede habilitar en una fase posterior o via feature flag
# whisper-rs = { version = "0.12", features = ["whisper-cpp-metal"] }

# Speech (opcional - se añadira en fase de voz)
# whisper-rs = "0.12"      # Requiere cmake + clang
# cpal = "0.15"              # Audio capture
# espeak-ng = "0.2"         # TTS

# Wake Word (opcional)
# ort = { version = "2.0", default-features = false, features = ["download-binaries"] }
# ndarray = "0.16"

# Qt bindings (se anadira en fase de UI)
# cxx-qt = "0.10"
# cxx-qt-build = { version = "0.10" }

[build-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

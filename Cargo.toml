[package]
name = "kde-assistant"
version = "0.1.0"
edition = "2021"
description = "Asistente de escritorio para KDE Plasma con estetica Apple, tool calling, voz estilo Siri y tray multifuncion"
authors = ["KDE Assistant Dev"]
license = "MIT"

default-run = "kde-assistant"

[[bin]]
name = "kde-assistant"
path = "src/main.rs"

[lib]
name = "kde_assistant_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP client (OpenRouter API)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP server local (IPC con la UI QML)
axum = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Audio capture (cpal)
cpal = "0.15"

# Global hotkeys (cross-platform)
rdev = "0.5"

# Chimes + TTS playback (rodio) + WAV reader/writer (hound)
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }
hound = "3.5"

# STT (whisper-rs, requiere cmake + clang para compilar whisper.cpp)
whisper-rs = "0.16"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
once_cell = "1"
hex = "0.4"
ctrlc = "3"

# Hashing para verificar integridad de descargas
sha2 = "0.10"

[build-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true